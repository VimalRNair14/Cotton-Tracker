name: Update cotton data

on:
  schedule:
    - cron: "45 21 * * 1-5"   # daily after ICE close (04:45 ICT next morning)
    - cron: "0 8 * * 1"       # Monday 15:00 ICT, one hour before the 16:00 email
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_cotton.py
      - name: Commit data.json if changed
        run: |
          git config user.name "cotton-bot"
          git config user.email "cotton-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update cotton data $(date -u +%F)" && git push)
